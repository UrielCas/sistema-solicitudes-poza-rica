services:
  mongo:
    image: mongo:7
    container_name: solicitudes_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: solicitudes_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/solicitudes_poza_rica
      JWT_SECRET: poza_rica_tic_secret_key_2026_super_segura
      JWT_REFRESH_SECRET: poza_rica_tic_refresh_key_2026_super_segura
      CORS_ORIGIN: http://localhost:5173
      ADMIN_EMAIL: admin@pozarica.gob.mx
      ADMIN_PASSWORD: Password123
      INITIAL_AREA_PASSWORD: PozaRica2026
      # En Windows los cambios del volumen montado no generan eventos de archivo:
      # sin polling, "tsx watch" no recarga el backend al editar el código.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: solicitudes_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
